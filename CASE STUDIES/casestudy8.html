<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Job Application Form</title>
    <h1>24070521213</h1>
    <link rel="stylesheet" href="casestudy8.css">
</head>
<body>

    <div class="form-container">
        <h2>Online Job Application</h2>
        
        <div id="successBanner" class="success-banner">
            Application submitted successfully!
        </div>

        <form id="jobForm" novalidate>
            <!-- Personal Information -->
            <fieldset>
                <legend>Personal Information</legend>
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required>
                    <span class="error-message" id="fullNameError"></span>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                    <span class="error-message" id="dobError"></span>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                    <span class="error-message" id="genderError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" required pattern="[0-9]{10}">
                    <span class="error-message" id="mobileError"></span>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" required>
                    <span class="error-message" id="addressError"></span>
                </div>

                <div class="form-group">
                    <label for="cityStatePin">City / State / PIN Code</label>
                    <input type="text" id="cityStatePin" required>
                    <span class="error-message" id="cityStatePinError"></span>
                </div>
            </fieldset>

            <!-- Educational Qualification -->
            <fieldset>
                <legend>Educational Qualification</legend>

                <div class="form-group">
                    <label for="qualification">Highest Qualification</label>
                    <input type="text" id="qualification" required>
                    <span class="error-message" id="qualificationError"></span>
                </div>

                <div class="form-group">
                    <label for="institute">University / Institute</label>
                    <input type="text" id="institute" required>
                    <span class="error-message" id="instituteError"></span>
                </div>

                <div class="form-group">
                    <label for="passingYear">Passing Year</label>
                    <input type="number" id="passingYear" min="1900" max="2026" required>
                    <span class="error-message" id="passingYearError"></span>
                </div>

                <div class="form-group">
                    <label for="percentage">Percentage / CGPA</label>
                    <input type="text" id="percentage" required>
                    <span class="error-message" id="percentageError"></span>
                </div>
            </fieldset>

            <!-- Professional Information -->
            <fieldset>
                <legend>Professional Information</legend>

                <div class="form-group">
                    <label for="jobPosition">Applying For / Job Position</label>
                    <input type="text" id="jobPosition" required>
                    <span class="error-message" id="jobPositionError"></span>
                </div>

                <div class="form-group">
                    <label for="experience">Total Work Experience (Years)</label>
                    <input type="number" id="experience" min="0" required>
                    <span class="error-message" id="experienceError"></span>
                </div>

                <div class="form-group">
                    <label for="organization">Current / Previous Organization</label>
                    <input type="text" id="organization" required>
                    <span class="error-message" id="organizationError"></span>
                </div>

                <div class="form-group">
                    <label for="designation">Current Designation</label>
                    <input type="text" id="designation" required>
                    <span class="error-message" id="designationError"></span>
                </div>

                <div class="form-group">
                    <label for="salary">Expected Salary</label>
                    <input type="text" id="salary" required>
                    <span class="error-message" id="salaryError"></span>
                </div>
            </fieldset>

            <!-- Technical Skills -->
            <fieldset>
                <legend>Technical Skills</legend>

                <div class="form-group">
                    <label for="languages">Programming Languages</label>
                    <input type="text" id="languages" placeholder="e.g., JavaScript, Python" required>
                    <span class="error-message" id="languagesError"></span>
                </div>

                <div class="form-group">
                    <label for="techSkills">Technical Skills</label>
                    <input type="text" id="techSkills" placeholder="e.g., Git, React, SQL" required>
                    <span class="error-message" id="techSkillsError"></span>
                </div>

                <div class="form-group">
                    <label for="certifications">Certifications</label>
                    <input type="text" id="certifications" placeholder="e.g., AWS Certified" required>
                    <span class="error-message" id="certificationsError"></span>
                </div>
            </fieldset>

            <button type="submit">Submit Application</button>
        </form>
    </div>

    <script src="casestudy8.js"></script>
</body>
</html>
