<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Registration</title>

    <link rel="stylesheet" href="style.css">

   
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Student Event Registration
            24070521213</h1>

        <div class="button-section">
            <button id="fetchButton">
                Load Student Data Using Fetch
            </button>

            <button id="jqueryButton">
                Load Student Data Using jQuery
            </button>
        </div>

        <div class="filter-section">
            <input
                type="text"
                id="searchBox"
                placeholder="Search by student name or PRN"
            >

            <select id="statusFilter">
                <option value="All">All Statuses</option>
                <option value="Registered">Registered</option>
                <option value="Pending">Pending</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>

        <div id="message"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>PRN</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Event Name</th>
                        <th>Registration Status</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                    

                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
