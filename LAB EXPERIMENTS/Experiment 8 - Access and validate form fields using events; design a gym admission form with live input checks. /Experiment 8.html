<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Gym Registration</title>
   
    <link rel="stylesheet" href="exp8.css">
</head>
<body>

<div class="form-container">
    <h2>Gym Registration Form</h2>
    <div id="successBanner" class="success-banner">Registration Successful! Welcome to the squad!</div>
    
    <form id="gymForm" novalidate>
        
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" >
            <span id="nameError" class="error-message"></span>
        </div>

        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="example@domain.com">
            <span id="emailError" class="error-message"></span>
        </div>

        
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number">
            <span id="phoneError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="membership">Membership Plan</label>
            <select id="membership">
                <option value="" disabled selected>-- Select a Plan --</option>
                <option value="monthly">Monthly Plan (₹1,500/month)</option>
                <option value="quarterly">Quarterly Plan (₹4,000/3-months)</option>
                <option value="yearly">Yearly Elite Plan (₹40,000/yr)</option>
            </select>
            <span id="membershipError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="password">Create Password</label>
            <input type="password" id="password" placeholder="Min. 6 characters">
            <span id="passwordError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password">
            <span id="confirmPasswordError" class="error-message"></span>
        </div>

        <button type="submit" id="submitBtn">Submit Admission</button>
    </form>
</div>

<script src="exp8.js"></script>
</body>
</html>
