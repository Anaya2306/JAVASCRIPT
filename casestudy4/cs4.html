<!DOCTYPE html>
<html>
<head>
    <title>ATM</title>
    <link rel="stylesheet" href="cs4.css">
</head>
<body>

    <div class="atm-container">
        <h1>ATM VERIFICATION</h1>
        
        <div class="display-screen">
            
            <input type="text" id="pinInput" placeholder="----" readonly>
            <p id="statusText">Enter your PIN code</p>
        </div>

        <div class="buttons-grid">
            <button onclick="pressKey('1')">1</button>
            <button onclick="pressKey('2')">2</button>
            <button onclick="pressKey('3')">3</button>
            <button onclick="pressKey('4')">4</button>
            <button onclick="pressKey('5')">5</button>
            <button onclick="pressKey('6')">6</button>
            <button onclick="pressKey('7')">7</button>
            <button onclick="pressKey('8')">8</button>
            <button onclick="pressKey('9')">9</button>
            <button class="clear-btn" onclick="eraseAll()">Clear</button>
            <button onclick="pressKey('0')">0</button>
            <button class="enter-btn" onclick="verifyPIN()">Enter</button>
        </div>
    </div>

    <script src="cs4.js"></script>
</body>
</html>
