<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Class Scheduler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Smart Class Scheduler</h1>

    <!-- Temporary Notification -->
    <div id="notification"></div>

    <!-- Active Class Status Card -->
    <div class="card">
      <h2 id="status-title">Loading Class Status...</h2>
      <p><strong>Subject:</strong> <span id="subject-name">-</span></p>
      <p><strong>Faculty:</strong> <span id="faculty-name">-</span></p>
      <p><strong>Classroom:</strong> <span id="room-name">-</span></p>
      <p><strong>Time:</strong> <span id="class-time">-</span></p>
      <div class="countdown" id="countdown-timer">--:--:--</div>
    </div>

    <!-- NEW FEATURE: Add Class Form -->
    <div class="card">
      <h3>Schedule a New Class</h3>
      <form id="class-form">
        <div class="form-group">
          <label for="input-subject">Subject Name:</label>
          <input type="text" id="input-subject" required placeholder="e.g. Operating Systems">
        </div>

        <div class="form-group">
          <label for="input-faculty">Faculty Name:</label>
          <input type="text" id="input-faculty" required placeholder="e.g. Prof. Smith">
        </div>

        <div class="form-group">
          <label for="input-room">Classroom:</label>
          <input type="text" id="input-room" required placeholder="e.g. Room 402">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="input-start">Start Time:</label>
            <input type="time" id="input-start" required>
          </div>
          <div class="form-group">
            <label for="input-end">End Time:</label>
            <input type="time" id="input-end" required>
          </div>
        </div>

        <button type="submit">Add Class to Schedule</button>
      </form>
    </div>

    <!-- Class Schedule List -->
    <div class="card">
      <h3>All Scheduled Classes Today</h3>
      <table>
        <thead>
          <tr>
            <th>Subject</th>
            <th>Faculty</th>
            <th>Room</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="schedule-table-body">
          <!-- Dynamic Rows -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
